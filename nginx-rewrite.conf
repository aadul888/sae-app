# ===================================================================
# SAE V4 - Nginx Rewrite Rules (Pengganti .htaccess)
# ===================================================================
# CARA PAKAI:
# 1. Login ke BT Panel (宝塔/aaPanel)
# 2. Buka Website → sae.smakpal.sch.id → Settings
# 3. Klik tab "Pseudo-static" (伪静态 / URL Rewrite)
# 4. COPY SEMUA isi file ini dan PASTE di kolom rewrite rules
# 5. Klik Save / 保存
# 6. Restart Nginx dari panel
#
# PENTING: Pastikan PHP version dan PHP-FPM sudah aktif untuk site ini
# ===================================================================

# --- Security: Block sensitive files ---
location ~ /\.(env|git|htaccess|htpasswd|svn) {
    return 404;
}

# --- Block access to library/config directly ---
location ~ ^/(library|database)/ {
    deny all;
    return 403;
}

# --- Let's Encrypt / ACME challenge ---
location ^~ /.well-known {
    allow all;
}

# --- Favicon fallback (serves content/favicon.png) ---
location = /favicon.ico {
    try_files $uri /favicon.php;
}

# --- Maintenance page routing ---
location = /maintenance {
    try_files $uri /maintenance.php?$args;
}

# --- API sync routes ---
location ~ ^/api/sync/([^/]+)/?$ {
    try_files $uri /api/sync.php?path=$1&$args;
}
location ~ ^/api/sync/?$ {
    try_files $uri /api/sync.php?$args;
}

# --- E-izin approve pretty URL ---
location = /admin/mod/e-izin/approve {
    try_files $uri /admin/mod/e-izin/approve.php?$args;
}

# --- Main rewrite rules ---
# Only rewrite if the requested file/dir doesn't physically exist
if (!-e $request_filename) {

    # ---- NISN routes ----
    rewrite ^/nisn/([^/]*)$  /index.php?mod=nisn&nisn=$1 last;

    # ---- Logout ----
    rewrite ^/logout$  /dashboard/oauth/logout.php last;

    # ---- Block direct maintenance.php ----
    rewrite ^/maintenance\.php$  /index.php last;

    # ---- Numeric NISN direct (8+ digit) ----
    rewrite ^/([0-9]{8,})$  /index.php?mod=nisn&nisn=$1 last;

    # ---- Admin routes ----
    rewrite ^/admin/login/?$  /admin/login/index.php last;
    rewrite ^/admin/login/forgot\.html$  /admin/login/forgot.php last;
    rewrite ^/admin/logout$  /admin/login/logout.php last;
    rewrite ^/admin/([a-zA-Z0-9_-]+)/?$  /admin/index.php?mod=$1 last;

    # ---- Dashboard routes ----
    rewrite ^/dashboard/logout$  /dashboard/oauth/logout.php last;
    rewrite ^/dashboard/([a-zA-Z0-9_-]+)/?$  /dashboard/index.php?mod=$1 last;

    # ---- Root module routing (HARUS PALING TERAKHIR) ----
    rewrite ^/([a-zA-Z0-9_-]+)/?$  /index.php?mod=$1 last;
}
